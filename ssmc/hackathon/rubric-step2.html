<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해커톤 루브릭 어드민 — Step 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Pretendard',sans-serif;background:#f0f2f8;min-height:100vh;color:#1e293b;display:flex;flex-direction:column;}
button,input,textarea{font-family:inherit;}

/* Header */
header{height:54px;background:#0f172a;display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 1px 0 #1e293b,0 4px 20px #00000040;flex-shrink:0;}
.hdr-logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;}
.hdr-title{color:#f1f5f9;font-size:14px;font-weight:700;}
.hdr-sep{color:#334155;}
.hdr-steps{display:flex;align-items:center;}

/* Layout */
.layout{display:flex;flex:1;min-height:0;height:calc(100vh - 54px);}

/* Sidebar */
aside{width:210px;flex-shrink:0;background:#1e1b4b;display:flex;flex-direction:column;overflow-y:auto;}
.sb-back{margin:10px 10px 0;padding:7px 10px;border-radius:8px;border:1px solid #2d2a6e;background:none;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.15s;}
.sb-back:hover{border-color:#6366f1;color:#a5b4fc;}
.sb-score{padding:11px 13px 9px;border-bottom:1px solid #2d2a6e;margin-top:8px;}
.sb-score-label{font-size:9px;font-weight:800;color:#6366f1;letter-spacing:0.12em;margin-bottom:4px;}
.sb-score-row{display:flex;justify-content:space-between;align-items:baseline;}
.sb-score-tone{font-size:11px;font-weight:800;}
.sb-score-val{font-size:13px;font-weight:800;color:#fff;}
.sb-score-unit{font-size:10px;color:#475569;}
.sb-tabs{padding:7px 9px;border-bottom:1px solid #2d2a6e;display:flex;gap:4px;}
.sb-tab{flex:1;padding:5px 0;border-radius:7px;border:none;font-size:10px;font-weight:800;cursor:pointer;background:transparent;transition:all 0.15s;}
.sb-nav{flex:1;padding:9px 7px;}
.sb-nav-label{font-size:9px;font-weight:800;color:#475569;letter-spacing:0.1em;margin-bottom:5px;padding-left:4px;}
.sb-cat{width:100%;text-align:left;padding:8px 9px;border-radius:9px;margin-bottom:3px;border:none;cursor:pointer;background:transparent;border-left:3px solid transparent;transition:background 0.15s;}
.sb-cat:hover{background:rgba(255,255,255,0.04);}
.sb-cat.active{border-left-color:var(--cc);}
.sb-cat-row{display:flex;align-items:center;gap:5px;margin-bottom:2px;}
.sb-cat-num{width:15px;height:15px;border-radius:4px;color:#fff;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-cat-name{font-size:11px;font-weight:800;flex:1;}
.sb-cat-count{font-size:9px;padding-left:20px;}
.sb-next{padding:9px 11px;border-top:1px solid #2d2a6e;}
.sb-next-btn{width:100%;padding:9px 0;border-radius:9px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px #6366f144;}

/* Main panel */
main{flex:1;min-width:0;overflow-y:auto;}
.panel{padding:22px 26px;}

/* Cat header */
.cat-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.cat-title-row{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.cat-num-badge{width:28px;height:28px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;}
.cat-name-input{font-size:18px;font-weight:800;color:#0f172a;border:none;outline:none;background:transparent;flex:1;}
.cat-mvp-only{font-size:10px;font-weight:800;color:#0f766e;background:#f0fdfa;border:1px solid #5eead4;padding:2px 8px;border-radius:99px;}
.cat-desc-wrap{padding-left:37px;}
.add-ind-btn{margin-left:10px;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;border-width:1.5px;border-style:solid;background:var(--cl);color:var(--cc);transition:all 0.15s;}

/* Classifier box */
.classifier-box{margin-bottom:12px;border-radius:10px;overflow:hidden;border:1.5px solid;}
.classifier-header{padding:9px 13px;border-bottom:1px solid;}
.classifier-header-row{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.classifier-body{padding:9px 13px;}
.classifier-item-row{display:flex;gap:6px;align-items:center;margin-bottom:3px;}
.classifier-check{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;border:1.5px solid;}
.keyword-tag{padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;}
.selection-note{margin-top:8px;padding:7px 10px;border-radius:7px;background:#fffbeb;border:1.5px solid #fcd34d;}
.selection-note-title{font-size:10px;font-weight:800;color:#b45309;margin-bottom:2px;}
.selection-note-text{font-size:11px;color:#78350f;line-height:1.6;white-space:pre-line;}

/* Dummy warning */
.dummy-warn{padding:5px 11px;border-radius:7px;margin-bottom:12px;background:#fef2f2;border:1px solid #fca5a5;font-size:11px;color:#991b1b;font-weight:600;}

/* Indicator card */
.ind-card{background:#fff;border-radius:11px;overflow:hidden;margin-bottom:10px;border:1.5px solid;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.ind-header{padding:9px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid;}
.ind-label-input{flex:1;border:none;outline:none;font-size:13px;font-weight:700;color:#0f172a;background:transparent;}
.ind-pdf-badge{font-size:10px;font-weight:700;color:#0369a1;background:#e0f2fe;border:1px solid #bae6fd;padding:2px 7px;border-radius:99px;flex-shrink:0;}
.ind-scale-btns{display:flex;gap:4px;flex-shrink:0;}
.ind-scale-btn{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid #e2e8f0;background:#f8fafc;color:#94a3b8;transition:all 0.13s;}
.ind-scale-btn.active{border-color:#6366f1;background:#eef2ff;color:#6366f1;}
.ind-del-btn{background:none;border:1px solid #fca5a5;border-radius:6px;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;padding:3px 8px;flex-shrink:0;}
.ind-body{padding:11px 13px;}
.field-label{font-size:10px;font-weight:800;color:#94a3b8;letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:4px;}
.auto-ta{width:100%;border:1.5px solid #e2e8f0;border-radius:7px;padding:7px 10px;font-size:12.5px;color:#1e293b;line-height:1.6;resize:none;outline:none;transition:border-color 0.15s;overflow:hidden;}
.auto-ta:focus{border-color:#818cf8;}
.auto-ta:disabled{background:#f8fafc;color:#94a3b8;border-color:#f1f5f9;}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cond-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start;}
.cond-badge{width:19px;height:19px;border-radius:5px;flex-shrink:0;margin-top:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;}
.cond-del{margin-top:7px;background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:14px;padding:1px 3px;}
.cond-del:hover{color:#ef4444;}
.add-cond-btn{padding:3px 9px;border:1.5px dashed #c7d2fe;border-radius:6px;background:none;color:#6366f1;font-size:11px;font-weight:700;cursor:pointer;}
.score-row{display:grid;grid-template-columns:46px 1fr;gap:7px;margin-bottom:7px;align-items:flex-start;}
.score-badge{padding:4px 0;border-radius:7px;text-align:center;border:1.5px solid;}
.score-num{font-size:13px;font-weight:900;}
.score-lv{font-size:8px;font-weight:800;}
.mvp-extra{border-radius:6px;overflow:hidden;border:1.5px dashed #99f6e4;background:#fafffe;}
.mvp-extra.has-val{border-color:#5eead4;background:#f0fdfa;}
.mvp-extra-header{padding:2px 8px;display:flex;align-items:center;justify-content:space-between;}
.mvp-extra-label{font-size:9px;font-weight:800;color:#0f766e;}
.mvp-revert{background:none;border:none;font-size:9px;color:#94a3b8;cursor:pointer;padding:0;}
.divider{border-top:1px solid #f1f5f9;margin:9px 0;}

/* Empty state */
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px;color:#94a3b8;}
</style>
</head>
<body>

<header>
  <div class="hdr-logo">H</div>
  <span class="hdr-title">해커톤 루브릭 어드민</span>
  <span class="hdr-sep">|</span>
  <div class="hdr-steps" id="hdrSteps"></div>
</header>

<div class="layout">
  <aside>
    <button class="sb-back" onclick="goBack()">← Step 1으로</button>
    <div class="sb-score">
      <div class="sb-score-label">총점 구조</div>
      <div class="sb-score-row">
        <span class="sb-score-tone" id="sbTone"></span>
        <span><span class="sb-score-val" id="sbScore"></span><span class="sb-score-unit">점</span></span>
      </div>
    </div>
    <div id="sbTabs" style="display:none" class="sb-tabs"></div>
    <nav class="sb-nav">
      <div class="sb-nav-label">카테고리</div>
      <div id="sbCatList"></div>
    </nav>
    <div class="sb-next">
      <button class="sb-next-btn" onclick="goNext()">Step 3 — Judge 그루핑 →</button>
    </div>
  </aside>

  <main>
    <div id="mainPanel"></div>
  </main>
</div>

<script>

const SLV5=[{key:"great",label:"매우우수",score:5,color:"#14532d",bg:"#bbf7d0",border:"#4ade80"},{key:"good",label:"우수",score:4,color:"#166534",bg:"#dcfce7",border:"#86efac"},{key:"normal",label:"보통",score:3,color:"#92400e",bg:"#fef3c7",border:"#fde68a"},{key:"poor",label:"미흡",score:2,color:"#991b1b",bg:"#fee2e2",border:"#fca5a5"},{key:"bad",label:"매우미흡",score:1,color:"#7f1d1d",bg:"#fecaca",border:"#f87171"}];

const CAT_DEFAULT = {
  1:{name:"문제 정의 및 혁신성",desc:"Pain Point, 타겟 사용자 정의, 기존 대안의 한계 분석, 차별성 및 혁신성",
    items:["해결하고자 하는 Pain Point","타겟 사용자 정의","시장 데이터 및 근거","기존 대안의 한계 분석","사용자 여정(User Journey)","문제의 심각도 및 영향도","제안하는 솔루션 개요","기존 대비 차별성 및 혁신성"],
    keywords:["타겟 고객","페인 포인트","현 상황의 한계","기존 솔루션 대비 차별점","경쟁 분석"],selectionNote:"",
    indicators:[
      {id:"c1i1",label:"문제 인식의 명확성",desc:"이 조직·현장에서 누가 어떤 상황에서 겪는 문제인지 실질적으로 특정되었는가?",conditions:[{id:"A",text:"해결 대상 특정: 타겟 사용자가 직군·역할·상황 수준으로 구체화됨."},{id:"B",text:"현장 맥락: 문제가 발생하는 업무 상황, 반복 패턴, 구조적 원인이 서술됨."},{id:"C",text:"현장 근거: 실제 경험 기반 근거와 사례가 1가지 이상 있음."}],scores:{good:"A~C 모두 충족.",normal:"A~C 중 1~2개 충족.",poor:"A 미충족, B 없음, C 없음 중 하나에 해당."},userDefined:false},
      {id:"c1i2",label:"혁신성",desc:"기존 방식의 한계가 인식되고 차별적 해결 접근이 드러나는가?",conditions:[{id:"A",text:"AS-IS 명시: 기존 방식이 구체적으로 서술됨."},{id:"B",text:"TO-BE 차별점: 기존 방식과 무엇이 다른지 구체적으로 서술됨."},{id:"C",text:"대안 불가 논리: 기존 방식으로는 해결되지 않는 이유가 1문장 이상 서술됨."}],scores:{good:"A~C 모두 충족.",normal:"A~C 중 1~2개 충족.",poor:"A 미충족, B 미충족, C 없음 중 하나에 해당."},userDefined:false},
    ]},
  2:{name:"기술 구현 계획",desc:"AI를 문제 해결에 맞게 설계한 방식, 입력→처리→출력 흐름",
    items:["AI를 문제 해결에 맞게 설계한 방식","입력 → 처리 → 출력 흐름","중간 처리 과정의 논리적 구성"],
    keywords:["입력","출력","처리","AI 모델","구조","흐름도"],selectionNote:"",
    indicators:[

  3:{name:"AI 활용의 적절성 및 MVP 완성도",desc:"AI 모델의 적용 방식 및 단계별 처리 로직, 실제 프로토타입 구현 여부",

    indicators:[

    keywords:["문제 해결","적용 가능성","실행 구조","실효성"],selectionNote:"",

    ]},
  5:{name:"ROI 및 기대효과의 정량성",desc:"수익성 및 비용 절감 효과, ROI/수치 기반 효과, 산출 근거의 타당성",
    items:["수익성 및 비용 절감 효과","ROI, 비용 절감액, 매출 증가 등 수치 기반 효과","산출 근거의 타당성","수익 모델의 현실성"],
    keywords:["ROI","비용 절감","매출 증가","수익 모델","정량 효과"],selectionNote:"",
    indicators:[
      {id:"c5i1",label:"효과 정량화 수준",desc:"기대 효과가 측정 가능하게 정의되고 수치 또는 인과 근거로 뒷받침되는가?",conditions:[{id:"A",text:"대상 특정: 누가, 어느 범위에서 정량적 효과를 얻는지 식별 가능."},{id:"B",text:"측정 지표 인과성: As-Is 대비 To-Be의 개선이 측정 지표를 중심으로 논리적으로 서술됨."}],scores:{good:"A + B 모두 충족.",normal:"A나 B 중 하나만 충족하거나 모호함.",poor:"정량적 측정 지표 언급이 없거나 선언적 문장만 존재."},userDefined:false},
    ]},
  6:{name:"신뢰 가능한 AI",desc:"인간 개입 구조(HITL), 설명 가능성, 오류 대응 및 통제 방안",
    items:["인간 개입 구조(HITL, Override)","결과에 대한 설명 가능성(Explainability)","오류 대응 및 통제 방안"],
    keywords:["HITL","신뢰 환경 구축","안전 장치","데이터 보안","책임성 확보","오류 대응"],
    selectionNote:"일반적 검수와 구조적 HITL을 구분할 것. 다음 중 하나 이상이 명확히 드러날 때만 선택:\n(1) AI 출력 이후 인간이 수정/승인/반려하는 명시적 프로세스\n(2) 개입 지점이 흐름도·단계·역할 분담으로 구조화\n(3) Override·재검토·수동 승인 등 통제 메커니즘 명시\n(4) 오류 대응·책임 주체·안전장치가 구체적으로 설명됨",
    indicators:[
      {id:"c6i1",label:"AI 신뢰도",desc:"AI 거버넌스 차원에서 지속적으로 활용 가능한 구조인가?",conditions:[{id:"A",text:"HITL: 고위험 출력에 인간이 최종 검토하는 구조 명시."},{id:"B",text:"설명 가능성: AI 판단 근거를 사용자가 이해할 수 있게 제공."},{id:"C",text:"오류 통제: 오작동 감지/수정 방안 및 안전 장치(Fallback) 명시."},{id:"D",text:"보안/윤리: 데이터 보호 및 책임성 확보 구조 언급."}],scores:{good:"A~D 중 3개 이상 충족.",normal:"A~D 중 2개 충족.",poor:"1개 이하 충족 및 AI 거버넌스 구조 인식 부재."},userDefined:false},
    ]},
};

// ── STATE ────────────────────────────────────────────────────────────────────

const s1 = MOCK_S1;
const isMvp = s1.tone === "mvp";
const allCats = isMvp ? [1,2,3,4,5,6] : [1,2,4,5,6];
const selCats = s1.selCats.filter(id => allCats.includes(id));

let state = {
  isMvpView: false,
  activeId: selCats[0] || null,
  cats: selCats.reduce((acc, id) => {
    acc[id] = clone(CAT_DEFAULT[id]);
    return acc;
  }, {}),
  mvpOvs: {},
};

// ── RENDER ────────────────────────────────────────────────────────────────────

function render() {
  renderHeader();
  renderSidebar();
  renderMain();
}

function renderHeader() {
  const steps = [{n:1,l:"평가 구조 설계"},{n:2,l:"세부 내용 입력"},{n:3,l:"Judge 그루핑"}];
  document.getElementById("hdrSteps").innerHTML = steps.map((s,i) => `
    <div style="display:flex;align-items:center;">
      <div style="display:flex;align-items:center;gap:7px;padding:0 4px;">
        <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
          background:${s.n===1?"#166534":s.n===2?"#6366f1":"#334155"};color:#fff;
          ${s.n===2?"box-shadow:0 0 0 3px #6366f144":""}">
          ${s.n===1?"✓":s.n}
        </div>
        <span style="font-size:11px;font-weight:700;color:${s.n===1?"#6ee7b7":s.n===2?"#e2e8f0":"#475569"}">${s.l}</span>
      </div>
      ${i<2?`<div style="width:24px;height:2px;background:${s.n===1?"#166534":"#2d2a6e"};margin:0 4px;border-radius:2px;"></div>`:""}
    </div>
  `).join("");
}

function totalInds() {
  return Object.values(state.cats).reduce((s,c)=>s+(c.indicators||[]).length, 0);
}

function renderSidebar() {
  const t = totalInds();
  document.getElementById("sbTone").textContent = state.isMvpView ? "MVP톤" : "아이디어톤";
  document.getElementById("sbTone").style.color = state.isMvpView ? "#6ee7b7" : "#a5b4fc";
  document.getElementById("sbScore").textContent = `${t}~${t*3}`;

  // MVP tabs
  const tabs = document.getElementById("sbTabs");
  if (isMvp) {
    tabs.style.display = "flex";
    tabs.innerHTML = [{v:false,l:"아이디어톤",c:"#a5b4fc"},{v:true,l:"MVP톤",c:"#6ee7b7"}].map(t=>`
      <button class="sb-tab" onclick="setMvpView(${t.v})"
        style="background:${state.isMvpView===t.v?"#312e81":"transparent"};color:${state.isMvpView===t.v?t.c:"#475569"}">${t.l}</button>
    `).join("");
  } else {
    tabs.style.display = "none";
  }

  document.getElementById("sbCatList").innerHTML = selCats.map(id => {
    const cat = state.cats[id];
    const m = CAT_META[id];
    const act = state.activeId === id;
    return `<button class="sb-cat ${act?"active":""}" style="--cc:${m.color};background:${act?m.color+"22":"transparent"}" onclick="setActive(${id})">
      <div class="sb-cat-row">
        <div class="sb-cat-num" style="background:${act?m.color:"#334155"}">${id}</div>
        <span class="sb-cat-name" style="color:${act?m.color:"#94a3b8"}">${cat.name.slice(0,11)}${cat.name.length>11?"…":""}</span>
      </div>
      <div class="sb-cat-count" style="color:${act?"#e2e8f0":"#475569"}">${(cat.indicators||[]).length}개 지표</div>
    </button>`;
  }).join("");
}

function renderMain() {
  const panel = document.getElementById("mainPanel");
  if (!state.activeId) {
    panel.innerHTML = `<div class="empty-state" style="height:calc(100vh - 54px)"><div style="font-size:32px">📋</div><p>카테고리를 선택해주세요</p></div>`;
    return;
  }
  const id = state.activeId;
  const cat = state.cats[id];
  const m = CAT_META[id];
  const isMvpV = state.isMvpView;
  const ovs = state.mvpOvs[id] || {};

  panel.innerHTML = renderCatPanel(id, cat, m, isMvpV, ovs);
  autoResizeAll();
}

function renderCatPanel(id, cat, m, isMvpV, ovs) {
  const inds = cat.indicators || [];
  return `
  <div class="panel">
    <div class="cat-header">
      <div style="flex:1">
        <div class="cat-title-row">
          <div class="cat-num-badge" style="background:${m.color}">${id}</div>
          ${isMvpV
            ? `<span style="font-size:18px;font-weight:800;color:#0f172a">${cat.name}</span>`
            : `<input class="cat-name-input" value="${esc(cat.name)}" oninput="updCat(${id},'name',this.value)" placeholder="카테고리 이름"/>`
          }
          ${m.mvpOnly?`<span class="cat-mvp-only">MVP톤 전용</span>`:""}
        </div>
        <div class="cat-desc-wrap">
          <textarea class="auto-ta" rows="1" ${isMvpV?"disabled":""} oninput="updCat(${id},'desc',this.value);autoResize(this)" placeholder="카테고리 설명...">${esc(cat.desc||"")}</textarea>
        </div>
      </div>
      ${!isMvpV?`<button class="add-ind-btn" style="--cc:${m.color};--cl:${m.light}" onclick="addInd(${id})">+ 지표 추가</button>`:""}
    </div>

    <!-- Classifier -->
    <div class="classifier-box" style="border-color:${m.mid}">
      <div class="classifier-header" style="background:${m.light};border-color:${m.mid}">
        <div class="classifier-header-row">
          <span style="font-size:13px">📄</span>
          <span style="font-size:12px;font-weight:800;color:${m.color}">이런 페이지가 이 항목으로 분류돼요</span>
          <span style="font-size:10px;font-weight:700;color:#0369a1;background:#e0f2fe;border:1px solid #bae6fd;padding:2px 7px;border-radius:99px;">📄 PDF 전용</span>
          ${isMvpV&&!m.mvpOnly?`<span style="margin-left:auto;font-size:10px;font-weight:700;color:#94a3b8;background:#f1f5f9;padding:2px 7px;border-radius:99px;">아이디어톤과 동일</span>`:""}
        </div>
        <p style="font-size:11px;color:#64748b;padding-left:19px;margin-top:2px">제출 발표자료에서 아래 내용이 담긴 페이지를 자동으로 이 항목으로 인식합니다.</p>
      </div>
      <div class="classifier-body" style="background:${isMvpV&&!m.mvpOnly?"#fafafa":"#fff"}">
        ${(cat.items||[]).map(item=>`
          <div class="classifier-item-row">
            <div class="classifier-check" style="background:${m.light};border-color:${m.mid};color:${m.color}">✓</div>
            <span style="font-size:12px;color:#374151">${item}</span>
          </div>`).join("")}
        ${(cat.keywords||[]).length?`
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:7px">
            ${cat.keywords.map(kw=>`<span class="keyword-tag" style="color:${m.color};background:${m.light};border:1px solid ${m.mid}">${kw}</span>`).join("")}
          </div>`:""
        }
        ${cat.selectionNote?`
          <div class="selection-note">
            <div class="selection-note-title">⚠️ 이럴 때만 이 항목으로 분류하세요</div>
            <div class="selection-note-text">${cat.selectionNote}</div>
          </div>`:""}
      </div>
    </div>

    <div class="dummy-warn">⭕ 이 카테고리에 해당하는 페이지가 없는 경우 자동 0점 처리</div>

    ${inds.map(ind => renderInd(id, ind, m, isMvpV, ovs[ind.id]||{})).join("")}
  </div>`;
}

function renderInd(catId, ind, m, isMvpV, ov) {
  const lvs = (ind.scoreScale||3)===5 ? SLV5 : SLV3;
  const hasOv = Object.values(ov).some(v=>v&&v.trim()!=="");
  const borderColor = isMvpV&&hasOv ? "#5eead4" : m.mid;
  const headerBg = isMvpV&&hasOv ? "#f0fdfa" : m.light;
  const headerBorder = isMvpV&&hasOv ? "#5eead4" : m.mid;

  return `
  <div class="ind-card" style="border-color:${borderColor};${isMvpV&&hasOv?"box-shadow:0 0 0 3px #5eead444":""}">
    <div class="ind-header" style="background:${headerBg};border-color:${headerBorder}">
      ${isMvpV&&hasOv?`<span style="font-size:10px;font-weight:800;color:#0f766e;background:#f0fdfa;border:1px solid #5eead4;padding:1px 7px;border-radius:99px">✦ 변경됨</span>`:""}
      <div style="flex:1">
        ${isMvpV
          ? `<span style="font-size:13px;font-weight:700;color:#0f172a">${esc(ind.label)}</span>`
          : `<textarea class="auto-ta" rows="1" style="font-size:13px;font-weight:700;border:none;padding:0;border-radius:0" oninput="updInd(${catId},'${ind.id}','label',this.value);autoResize(this)">${esc(ind.label)}</textarea>`
        }
      </div>
      ${!ind.userDefined?`<span class="ind-pdf-badge">📄 PDF 전용</span>`:""}
      ${ind.userDefined&&!isMvpV?`
        <div class="ind-scale-btns">
          <button class="ind-scale-btn ${(ind.scoreScale||3)===3?"active":""}" onclick="updInd(${catId},'${ind.id}','scoreScale',3);updInd(${catId},'${ind.id}','scores',{})">3점</button>
          <button class="ind-scale-btn ${(ind.scoreScale||3)===5?"active":""}" onclick="updInd(${catId},'${ind.id}','scoreScale',5);updInd(${catId},'${ind.id}','scores',{})">5점</button>
        </div>`:""}
      ${!isMvpV?`<button class="ind-del-btn" onclick="delInd(${catId},'${ind.id}')">삭제</button>`:""}
    </div>
    <div class="ind-body">
      <div style="margin-bottom:9px">
        <label class="field-label">평가 목표</label>
        <textarea class="auto-ta" rows="2" ${isMvpV?"disabled":""} oninput="updInd(${catId},'${ind.id}','desc',this.value);autoResize(this)" placeholder="이 지표가 평가하는 것...">${esc(ind.desc||"")}</textarea>
      </div>
      <div class="divider"></div>
      <div class="ind-grid">
        <div>
          <label class="field-label">${isMvpV?"달성 조건 (아이디어톤 동일)":"달성 조건"}</label>
          ${(ind.conditions||[]).map((c,ci)=>`
            <div class="cond-row">
              <div class="cond-badge" style="background:${isMvpV?"#e2e8f0":"#6366f1"};color:${isMvpV?"#94a3b8":"#fff"};margin-top:6px">${c.id}</div>
              <div style="flex:1"><textarea class="auto-ta" rows="1" ${isMvpV?"disabled":""} oninput="updCond(${catId},'${ind.id}',${ci},this.value);autoResize(this)">${esc(c.text||"")}</textarea></div>
              ${!isMvpV?`<button class="cond-del" onclick="delCond(${catId},'${ind.id}',${ci})">×</button>`:""}
            </div>`).join("")}
          ${!isMvpV?`<button class="add-cond-btn" onclick="addCond(${catId},'${ind.id}')">+ 조건 추가</button>`:""}
        </div>
        <div>
          <label class="field-label">점수 판단 기준</label>
          ${lvs.map(lv=>{
            const hasOvLv = ov[lv.key]&&ov[lv.key].trim()!=="";
            return `
            <div class="score-row">
              <div class="score-badge" style="background:${lv.bg};border-color:${lv.border}">
                <div class="score-num" style="color:${lv.color}">${lv.score}</div>
                <div class="score-lv" style="color:${lv.color}">${lv.label}</div>
              </div>
              <div style="display:flex;flex-direction:column;gap:3px">
                <textarea class="auto-ta" rows="${isMvpV?1:2}" ${isMvpV?"disabled":""} oninput="updScore(${catId},'${ind.id}','${lv.key}',this.value);autoResize(this)" placeholder="${lv.label} 기준...">${esc((ind.scores||{})[lv.key]||"")}</textarea>
                ${isMvpV?`
                  <div class="mvp-extra ${hasOvLv?"has-val":""}">
                    <div class="mvp-extra-header" style="background:${hasOvLv?"#ccfbf1":"transparent"}">
                      <span class="mvp-extra-label">MVP톤 추가/변경</span>
                      ${hasOvLv?`<button class="mvp-revert" onclick="revertOv(${catId},'${ind.id}','${lv.key}')">↩ 원복</button>`:""}
                    </div>
                    <textarea class="auto-ta" rows="1" style="border:none;border-radius:0" oninput="updOv(${catId},'${ind.id}','${lv.key}',this.value);autoResize(this)" placeholder="변경할 내용...">${esc((ov[lv.key])||"")}</textarea>
                  </div>`:""
                }
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function setActive(id){ state.activeId=id; renderSidebar(); renderMain(); }
function setMvpView(v){ state.isMvpView=v; render(); }
function goBack(){ alert("Step 1으로 이동합니다."); }
function goNext(){ alert("Step 3으로 이동합니다."); }

function updCat(id,field,val){ state.cats[id][field]=val; renderSidebar(); }
function updInd(catId,indId,field,val){
  const ind=state.cats[catId].indicators.find(i=>i.id===indId);
  if(ind){ ind[field]=val; renderSidebar(); }
}
function updCond(catId,indId,ci,val){
  const ind=state.cats[catId].indicators.find(i=>i.id===indId);
  if(ind&&ind.conditions[ci]) ind.conditions[ci].text=val;
}
function updScore(catId,indId,key,val){
  const ind=state.cats[catId].indicators.find(i=>i.id===indId);
  if(ind){ if(!ind.scores)ind.scores={}; ind.scores[key]=val; }
}
function updOv(catId,indId,key,val){
  if(!state.mvpOvs[catId]) state.mvpOvs[catId]={};
  if(!state.mvpOvs[catId][indId]) state.mvpOvs[catId][indId]={};
  state.mvpOvs[catId][indId][key]=val;
  renderSidebar();
  // Re-render header only for changed badge
  const cards=document.querySelectorAll('.ind-card');
  // lightweight: just update sidebar
}
function revertOv(catId,indId,key){
  if(state.mvpOvs[catId]&&state.mvpOvs[catId][indId]) state.mvpOvs[catId][indId][key]="";
  renderMain();
}
function addInd(catId){
  const COND_IDS=["A","B","C","D","E"];
  state.cats[catId].indicators.push({id:uid(),label:"새 지표",desc:"",conditions:[{id:"A",text:""}],scores:{good:"",normal:"",poor:""},userDefined:true,scoreScale:3});
  renderSidebar(); renderMain();
}
function delInd(catId,indId){
  state.cats[catId].indicators=state.cats[catId].indicators.filter(i=>i.id!==indId);
  renderSidebar(); renderMain();
}
function addCond(catId,indId){
  const ind=state.cats[catId].indicators.find(i=>i.id===indId);
  if(!ind) return;
  const ids=["A","B","C","D","E","F"];
  const nextId=ids[ind.conditions.length]||String(ind.conditions.length+1);
  ind.conditions.push({id:nextId,text:""});
  renderMain();
}
function delCond(catId,indId,ci){
  const ind=state.cats[catId].indicators.find(i=>i.id===indId);
  if(ind) ind.conditions=ind.conditions.filter((_,j)=>j!==ci);
  renderMain();
}

// Auto-resize textareas
function autoResize(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
function autoResizeAll(){ document.querySelectorAll('.auto-ta').forEach(autoResize); }

render();
</script>
</body>
</html>
