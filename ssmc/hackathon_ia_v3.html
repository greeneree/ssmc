header {

.h-badge { margin-left: auto; font-size: 11px; color: #888; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3px 10px; white-space: nowrap; }

.toolbar {
  background: #fff; border-bottom: 1px solid rgba(0,0,0,0.08);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  position: sticky; top: 49px; z-index: 100;
}
.filter-label { font-size: 11px; color: #999; margin-right: 2px; white-space: nowrap; }
.filter-btn {
  font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
  padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.12);
  background: #fff; cursor: pointer; font-weight: 500; color: #555; transition: all .15s;
}
.filter-btn:hover { border-color: #10b981; color: #10b981; }
.filter-btn.active { background: #111; color: #fff; border-color: #111; }
.sep { width: 1px; height: 18px; background: rgba(0,0,0,0.1); margin: 0 2px; }
.count-badge { font-size: 11px; color: #aaa; margin-left: auto; white-space: nowrap; }

.table-wrap { padding: 14px 12px 60px; overflow-x: auto; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); min-width: 1000px; }
thead th { background: #111; color: #fff; padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
tbody tr { border-bottom: 1px solid rgba(0,0,0,0.05); transition: background .1s; }
tbody tr:hover { background: #fafaf8; }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 7px 12px; vertical-align: middle; line-height: 1.5; }

.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.badge-front { background: #e1f5ee; color: #0f6e56; }
.badge-admin { background: #eeedfe; color: #3c3489; }

.target-동료 { background: #eaf3de; color: #27500a; }
.target-심사 { background: #faeeda; color: #633806; }

.target-시스템관리자 { background: #f1f0eb; color: #5f5e5a; }

.d1 { font-weight: 600; color: #111; }
.d2 { color: #333; }
.d3 { color: #555; }
.d4 { color: #777; font-size: 11.5px; }
td.dash { color: #e0e0e0; }
.login-o { color: #059669; font-weight: 700; text-align: center; }
.note { color: #777; font-size: 11px; line-height: 1.45; }

.change { display: inline-block; font-size: 9px; font-weight: 700; border-radius: 3px; padding: 1px 5px; margin-left: 4px; vertical-align: middle; white-space: nowrap; }
.add   { background: #10b981; color: #fff; }
.del   { background: #9ca3af; color: #fff; }
.mod   { background: #f59e0b; color: #fff; }
.exist { background: #e5e7eb; color: #374151; }

tr.gb-front { border-left: 3px solid #10b981; }
tr.gb-admin { border-left: 3px solid #7f77dd; }

const targetLabel = {'참가자':'참가자','동료':'동료평가자','심사':'심사위원','운영자':'운영자','시스템관리자':'시스템관리자'};
const targetClass = {'참가자':'참가자','동료':'동료','심사':'심사','운영자':'운영자','시스템관리자':'시스템관리자'};
const changeLabel = {'add':'추가','del':'삭제','mod':'수정','exist':'기존활용','':''};
const changeClass = {'add':'add','del':'del','mod':'mod','exist':'exist','':''};

let fGb='all', fTg='all', fCh='all';

function depthCell(val, cls) {
  if (!val) return `<td class="dash">—</td>`;
  return `<td class="${cls}">${val}</td>`;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let count = 0;
  data.forEach(r => {
    if (fGb !== 'all' && r.gb !== fGb) return;
    if (fTg !== 'all' && r.tg !== fTg) return;
    if (fCh !== 'all' && r.ch !== fCh) return;
    count++;
    const tr = document.createElement('tr');
    const rowClass = r.gb==='Front' ? 'gb-front' : r.tg==='시스템관리자' ? 'gb-sys' : 'gb-admin';
    tr.className = rowClass;
    const chHtml = r.ch ? `<span class="change ${changeClass[r.ch]}">${changeLabel[r.ch]}</span>` : '';
    const gbClass = r.gb==='Front' ? 'badge-front' : 'badge-admin';
    tr.innerHTML = `
      <td><span class="badge ${gbClass}">${r.gb}</span></td>
      <td><span class="target target-${targetClass[r.tg]}">${targetLabel[r.tg]}</span></td>
      ${depthCell(r.d1,'d1')}
      ${depthCell(r.d2,'d2')}
      ${depthCell(r.d3,'d3')}
      ${depthCell(r.d4,'d4')}
      <td class="login-o">${r.login}</td>
      <td class="note">${r.note}${chHtml}</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('rowCount').textContent = `${count}개 항목`;
}

function setFilter(type, val, btn) {
  const groups = {gb:[0,3], tg:[3,8], ch:[8,12]};
  const [s,e] = groups[type];
  document.querySelectorAll('.filter-btn').forEach((b,i)=>{if(i>=s&&i<e)b.classList.remove('active');});
  if(type==='gb') fGb=val;
  else if(type==='tg') fTg=val;
  else fCh=val;
  btn.classList.add('active');
  render();
}

render();

function downloadExcel() {
  const changeLabel = {'add':'추가','del':'삭제','mod':'수정','exist':'기존활용','':''};
  const targetLabel = {'참가자':'참가자','동료':'동료평가자','심사':'심사위원','운영자':'운영자','시스템관리자':'시스템관리자'};

  const header = ['구분','Target','1Depth','2Depth','3Depth','4Depth','로그인 여부','비고','변경사항'];
  const rows = data.map(r => [
    r.gb,
    targetLabel[r.tg],
    r.d1, r.d2, r.d3, r.d4,
    r.login,
    r.note,
    changeLabel[r.ch] || ''
  ]);

  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);

  // 컬럼 너비
  ws['!cols'] = [
    {wch:8},{wch:12},{wch:16},{wch:18},{wch:20},{wch:22},{wch:8},{wch:40},{wch:8}
  ];

  // 헤더 스타일
  header.forEach((_, i) => {
    const cell = ws[XLSX.utils.encode_cell({r:0, c:i})];
    if (cell) cell.s = { font:{bold:true}, fill:{fgColor:{rgb:'111111'}}, font:{color:{rgb:'FFFFFF'}, bold:true} };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'IA v3 Final');
  XLSX.writeFile(wb, 'AI해커톤_IA_v3_Final.xlsx');
}
